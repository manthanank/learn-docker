version: "3.8"

services:
  learn-docker-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: manthanank/learn-docker:latest
    container_name: learn-docker-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - docker-lab-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

networks:
  docker-lab-net:
    driver: bridge

volumes:
  docker-lab-data:
    driver: local
